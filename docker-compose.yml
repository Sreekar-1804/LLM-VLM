services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: visionguard-backend
    ports:
      - "8000:8000"
    environment:
      - VLM_PROVIDER=mock
      - LLM_PROVIDER=mock
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - RETRIEVAL_TOP_K=3
      - MLFLOW_TRACKING_URI=file:///app/mlruns
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./mlruns:/app/mlruns
      - ./logs:/app/logs
      - ./vector_store:/app/vector_store
    depends_on:
      - mlflow

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: visionguard-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

  mlflow:
    image: python:3.11-slim
    container_name: visionguard-mlflow
    working_dir: /app
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    command: >
      sh -c "pip install mlflow && mlflow ui --backend-store-uri file:///app/mlruns --host 0.0.0.0 --port 5000"